[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excelkit"
version = "0.2.3"
description = "A lightweight Python library for reading and writing Excel workbooks"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ExcelKit contributors" }]
dependencies = [
  "xlrd>=2.0.2,<3",
  "xlwt>=1.3.0,<2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[tool.setuptools.packages.find]
include = ["excelkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
