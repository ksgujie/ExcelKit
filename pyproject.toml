[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "excelkit"
version = "0.1.1"
description = "精简实用的 Excel 读写库（XLSX/XLS/CSV/TSV），基于原 ExcelKit 精简而来。"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "ksgujie" }]
keywords = ["excel", "xlsx", "xls", "csv", "tsv"]
dependencies = ["xlrd", "xlwt"]

[tool.setuptools.packages.find]
where = ["."]
include = ["excelkit*"]
